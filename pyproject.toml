[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-wiki"
version = "0.1.0"
description = "An honest, educational classical and quantum context-selection laboratory."
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8", "pandas>=2.0"]
quantum = ["pennylane>=0.45.1,<0.46"]
ibm = ["pennylane-qiskit==0.45.0"]
embeddings = ["sentence-transformers>=3.0"]

[project.scripts]
quantum-wiki = "quantum_wiki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
